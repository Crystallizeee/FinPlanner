version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: financial_vault_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: financial_vault
      DB_USERNAME: vault_user
      DB_PASSWORD: vault_secret_password
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/var/www
      - app_storage:/var/www/storage/app

  postgres:
    image: postgres:16-alpine
    container_name: financial_vault_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: financial_vault
      POSTGRES_USER: vault_user
      POSTGRES_PASSWORD: vault_secret_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault_user -d financial_vault"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: financial_vault_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  app_storage:
